<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PocketNews Episode</title>
  <style>
    :root {
      color: #171818;
      background: #f5f1e9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f1e9; }
    button { font: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; }
    .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid #c9c3b8; padding-bottom: 16px; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: 0; }
    .run { font-size: 13px; color: #6d6961; overflow-wrap: anywhere; text-align: right; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 28px; padding-top: 24px; }
    .stage { min-width: 0; }
    .visual { position: relative; min-height: 500px; background: #24302a; overflow: hidden; }
    .visual img { width: 100%; height: 100%; min-height: 500px; object-fit: cover; display: block; }
    .visual::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.28); pointer-events: none; }
    .visual-copy { position: absolute; z-index: 1; left: 28px; right: 28px; bottom: 26px; color: #fff; }
    .eyebrow { margin: 0 0 8px; color: #f0b35c; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.05; letter-spacing: 0; max-width: 850px; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
    .caption { margin: 12px 0 0; font-size: 17px; line-height: 1.45; max-width: 760px; }
    .controls { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 10px; border-bottom: 1px solid #c9c3b8; padding: 18px 0; }
    .command { min-height: 42px; border: 1px solid #171818; border-radius: 5px; padding: 0 16px; background: transparent; color: #171818; cursor: pointer; font-weight: 700; }
    .command:hover { background: #171818; color: #fff; }
    .command.primary { background: #df5d40; border-color: #df5d40; color: #fff; }
    .command.primary:hover { background: #bd442c; border-color: #bd442c; }
    .progress { height: 4px; background: #d8d1c5; overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: #2d7666; transition: width .12s linear; }
    .timer { color: #6d6961; font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
    .sidebar { border-left: 1px solid #c9c3b8; padding-left: 22px; }
    .sidebar h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0; margin: 0 0 14px; }
    .story-list { display: grid; gap: 8px; }
    .story { border: 1px solid #c9c3b8; border-radius: 5px; background: transparent; text-align: left; padding: 13px; cursor: pointer; color: inherit; }
    .story:hover, .story.active { border-color: #2d7666; background: #e1ece5; }
    .story-number { display: block; color: #2d7666; font-size: 12px; font-weight: 800; margin-bottom: 6px; }
    .story-title { display: block; font-weight: 700; line-height: 1.25; }
    .story-category { display: block; color: #6d6961; font-size: 12px; margin-top: 7px; }
    .empty { display: grid; place-items: center; min-height: 500px; padding: 32px; color: #fff; text-align: center; font-size: 18px; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-left: 0; border-top: 1px solid #c9c3b8; padding: 20px 0 0; }
      .story-list { grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); }
      .visual, .visual img, .empty { min-height: 56vh; }
    }
    @media (max-width: 540px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 4px; }
      .run { text-align: left; }
      .visual-copy { left: 18px; right: 18px; bottom: 18px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .progress { grid-column: 1 / -1; grid-row: 2; }
      .timer { grid-column: 1 / -1; grid-row: 3; }
      .command { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">PocketNews</div>
      <div class="run" id="run-name"></div>
    </header>
    <div class="layout">
      <section class="stage">
        <div class="visual" id="visual">
          <div class="empty" id="empty-state">Loading episode</div>
          <img id="story-image" alt="" hidden>
          <div class="visual-copy" id="visual-copy" hidden>
            <p class="eyebrow" id="story-meta"></p>
            <h1 id="story-title"></h1>
            <p class="caption" id="line-text"></p>
          </div>
        </div>
        <div class="controls">
          <button class="command primary" id="play-button" type="button">Play</button>
          <button class="command" id="skip-button" type="button">Skip story</button>
          <div class="progress" aria-label="Episode progress"><span id="progress-fill"></span></div>
          <div class="timer" id="timer">0:00</div>
        </div>
      </section>
      <aside class="sidebar">
        <h2>Episode</h2>
        <div class="story-list" id="story-list"></div>
      </aside>
    </div>
  </main>
  <audio id="audio"></audio>
  <script>
    // Change this value to play another generated scripts folder.
    const RUN_FOLDER = "2026-07-25_8ebcb92f";

    const state = { stories: [], storyIndex: 0, trackIndex: 0, elapsed: 0, playing: false };
    const audio = document.querySelector("#audio");
    const elements = {
      empty: document.querySelector("#empty-state"), image: document.querySelector("#story-image"), copy: document.querySelector("#visual-copy"),
      meta: document.querySelector("#story-meta"), title: document.querySelector("#story-title"), line: document.querySelector("#line-text"),
      list: document.querySelector("#story-list"), play: document.querySelector("#play-button"), skip: document.querySelector("#skip-button"),
      progress: document.querySelector("#progress-fill"), timer: document.querySelector("#timer"), run: document.querySelector("#run-name")
    };

    const fetchJson = async (url) => {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Episode assets could not be loaded.");
      return response.json();
    };

    const mediaUrl = (path) => {
      const prefix = `scripts/${RUN_FOLDER}/`;
      const relativePath = path.startsWith(prefix) ? path.slice(prefix.length) : path;
      return `/api/media/${RUN_FOLDER}/${relativePath}`;
    };

    const scriptFileName = (path) => path.split("/").pop();
    const scriptStem = (path) => scriptFileName(path).replace(/\.json$/, "");

    async function loadEpisode() {
      elements.run.textContent = RUN_FOLDER;
      const runManifest = await fetchJson(mediaUrl("manifest.json"));
      const stories = await Promise.all((runManifest.scripts || []).map(async (entry) => {
        const script = await fetchJson(mediaUrl(scriptFileName(entry.scriptPath)));
        let audioManifest = { clips: [] };
        try {
          audioManifest = await fetchJson(mediaUrl(`audio/${scriptStem(entry.scriptPath)}/manifest.json`));
        } catch (_) {}
        return buildStory(script, audioManifest, scriptStem(entry.scriptPath));
      }));
      state.stories = stories.filter((story) => story.tracks.length);
      if (!state.stories.length) throw new Error("No playable audio was found in this folder.");
      elements.empty.hidden = true;
      elements.image.hidden = false;
      elements.copy.hidden = false;
      renderStoryList();
      renderCurrentTrack();
    }

    function buildStory(script, audioManifest, stem) {
      const story = script.story;
      const clips = new Map((audioManifest.clips || []).map((clip) => [`${clip.beatId}-${clip.lineIndex}`, clip]));
      const canRecoverFromFailedManifest = (audioManifest.failures || []).length > 0;
      const tracks = [];
      (story.beats || []).forEach((beat) => (beat.lines || []).forEach((line, lineIndex) => {
        const clip = clips.get(`${beat.id}-${lineIndex}`);
        const fallbackUrl = canRecoverFromFailedManifest
          ? mediaUrl(`audio/${stem}/${beat.id}/${lineIndex}.wav`)
          : "";
        if (!clip?.url && !fallbackUrl) return;
        tracks.push({
          url: clip?.url || fallbackUrl,
          duration: Number(clip.durationSeconds) || 0,
          text: line.text,
          speaker: line.speaker,
          image: beat.visual && beat.visual.imagePath ? mediaUrl(beat.visual.imagePath) : "",
          beatId: beat.id
        });
      }));
      return { title: story.title, category: story.classification?.category || story.category || "News", tracks };
    }

    function renderStoryList() {
      elements.list.replaceChildren(...state.stories.map((story, index) => {
        const button = document.createElement("button");
        button.className = `story${index === state.storyIndex ? " active" : ""}`;
        button.type = "button";
        button.innerHTML = `<span class="story-number">${String(index + 1).padStart(2, "0")}</span><span class="story-title"></span><span class="story-category"></span>`;
        button.querySelector(".story-title").textContent = story.title;
        button.querySelector(".story-category").textContent = story.category;
        button.addEventListener("click", () => selectStory(index));
        return button;
      }));
    }

    function renderCurrentTrack() {
      const story = state.stories[state.storyIndex];
      const track = story && story.tracks[state.trackIndex];
      if (!track) return;
      elements.title.textContent = story.title;
      elements.meta.textContent = `${story.category} · Story ${state.storyIndex + 1} of ${state.stories.length}`;
      elements.line.textContent = track.text;
      if (track.image) elements.image.src = track.image;
      renderStoryList();
      updateProgress();
    }

    async function playCurrentTrack() {
      const story = state.stories[state.storyIndex];
      const track = story && story.tracks[state.trackIndex];
      if (!track) return finishEpisode();
      audio.src = track.url;
      renderCurrentTrack();
      try {
        await audio.play();
        state.playing = true;
        elements.play.textContent = "Pause";
      } catch (_) {
        state.playing = false;
        elements.play.textContent = "Play";
      }
    }

    function selectStory(index) {
      audio.pause();
      state.storyIndex = index;
      state.trackIndex = 0;
      state.elapsed = storyElapsedBefore(index);
      playCurrentTrack();
    }

    function skipStory() {
      if (state.storyIndex < state.stories.length - 1) selectStory(state.storyIndex + 1);
      else finishEpisode();
    }

    function nextTrack() {
      const currentStory = state.stories[state.storyIndex];
      state.elapsed += currentStory.tracks[state.trackIndex].duration;
      if (state.trackIndex < currentStory.tracks.length - 1) {
        state.trackIndex += 1;
        playCurrentTrack();
      } else if (state.storyIndex < state.stories.length - 1) {
        state.storyIndex += 1;
        state.trackIndex = 0;
        playCurrentTrack();
      } else finishEpisode();
    }

    function finishEpisode() {
      audio.pause();
      state.playing = false;
      elements.play.textContent = "Replay";
      state.storyIndex = 0;
      state.trackIndex = 0;
      state.elapsed = 0;
      renderCurrentTrack();
    }

    function storyElapsedBefore(index) {
      return state.stories.slice(0, index).flatMap((story) => story.tracks).reduce((sum, track) => sum + track.duration, 0);
    }

    function totalDuration() {
      return state.stories.flatMap((story) => story.tracks).reduce((sum, track) => sum + track.duration, 0);
    }

    function updateProgress() {
      const total = totalDuration();
      const current = Math.min(state.elapsed + audio.currentTime, total);
      elements.progress.style.width = total ? `${(current / total) * 100}%` : "0";
      elements.timer.textContent = `${formatTime(current)} / ${formatTime(total)}`;
    }

    function formatTime(seconds) {
      const rounded = Math.floor(seconds || 0);
      return `${Math.floor(rounded / 60)}:${String(rounded % 60).padStart(2, "0")}`;
    }

    elements.play.addEventListener("click", () => {
      if (state.playing) {
        audio.pause();
        state.playing = false;
        elements.play.textContent = "Play";
      } else playCurrentTrack();
    });
    elements.skip.addEventListener("click", skipStory);
    audio.addEventListener("ended", nextTrack);
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("loadedmetadata", () => {
      const story = state.stories[state.storyIndex];
      const track = story && story.tracks[state.trackIndex];
      if (track && !track.duration && Number.isFinite(audio.duration)) {
        track.duration = audio.duration;
        updateProgress();
      }
    });
    loadEpisode().catch((error) => { elements.empty.textContent = error.message; });
  </script>
</body>
</html>
